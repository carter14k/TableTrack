<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTrack | Add Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TableTrack</h1>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-order.html">Add Order</a>
            <a href="orders.html">Orders</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add New Order</h2>
        </section>
        <form id="form">
            <label for="tnumber">Table number</label>
            <input min="1"  type="number" id="tnumber" required step="1" >
            <label for="dishname">Dish name</label>
            <input type="text" id="dishname" required>
            <label for="category">Category</label>
            <select  id="category" required>
                <option value="starter">Starter</option>
                <option value="main">Main</option>
                <option value="drink">Drink</option>
                <option value="dessert">Dessert</option>
            </select>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" required min="1" step="1">
            <label for="unitprice">Unit price</label>
            <input type="number" id="unitprice" required min="0.01" step="0.01">
            <label for="order-date">Order date</label>
            <input type="date" id="order-date" required>

            <p id="formError" role="alert"></p>
            <button type="submit">Submit Order</button>
        </form>
        
    </main>
     <footer>
        <small>TableTrack &copy; 2026. Restaurant orders and sales tracking.</small>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
